name: Publish npm packages

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install npm with trusted publishing support
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package versions
        run: node scripts/validate-release-version.mjs

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Pack public packages
        run: |
          mkdir release-packages
          pnpm -r --filter './packages/**' pack --pack-destination "$GITHUB_WORKSPACE/release-packages"

      - name: Publish public packages with provenance
        run: |
          for package in release-packages/*.tgz; do
            npm publish "./$package" --access public --tag alpha --provenance
          done
