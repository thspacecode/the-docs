name: Publish npm packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install npm with trusted publishing support
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package versions
        run: node scripts/validate-release-version.mjs

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Pack public packages
        run: |
          mkdir release-packages
          pnpm -r --filter './packages/**' pack --pack-destination "$GITHUB_WORKSPACE/release-packages"

      - name: Publish public packages
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          token_config="$RUNNER_TEMP/npm-bootstrap.npmrc"
          trap 'rm -f "$token_config"' EXIT

          for package in release-packages/*.tgz; do
            name="$(tar -xOf "$package" package/package.json | node -e 'const fs = require("node:fs"); console.log(JSON.parse(fs.readFileSync(0, "utf8")).name)')"

            if npm view "$name" name >/dev/null 2>&1; then
              npm publish "./$package" --access public --tag alpha
              continue
            fi

            if [ -z "$NPM_BOOTSTRAP_TOKEN" ]; then
              echo "::error::Cannot publish new package $name with OIDC. Add a granular NPM_TOKEN secret for its first publish."
              exit 1
            fi

            printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$token_config"
            NPM_CONFIG_USERCONFIG="$token_config" NODE_AUTH_TOKEN="$NPM_BOOTSTRAP_TOKEN" \
              npm publish "./$package" --access public --tag alpha
            rm -f "$token_config"
            echo "::notice::Configure publish-npm.yml as the trusted publisher for $name before its next release."
          done
