name: Publish npm packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package versions
        run: node scripts/validate-release-version.mjs

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Pack public packages
        run: |
          mkdir release-packages
          pnpm -r --filter './packages/**' pack --pack-destination "$GITHUB_WORKSPACE/release-packages"

      - name: Publish public packages with OIDC
        run: |
          for package in release-packages/*.tgz; do
            npm publish "$package" --access public --tag alpha
          done
